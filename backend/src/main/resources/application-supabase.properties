# Perfil "supabase": banco PostgreSQL do Supabase (hospedagem). Ativado por SPRING_PROFILES_ACTIVE=supabase.
# Sem este perfil, o backend usa o Oracle da FIAP (application.properties).
#
# Variaveis de ambiente (definidas no painel do Render, nunca neste arquivo):
#   SUPABASE_DB_URL       jdbc:postgresql://HOST_DO_POOLER:5432/postgres?sslmode=require
#   SUPABASE_DB_USER      postgres.REFERENCIA_DO_PROJETO
#   SUPABASE_DB_PASSWORD  senha do banco no Supabase

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Cria as tabelas na primeira subida (CREATE TABLE IF NOT EXISTS) e nao altera as que ja existem
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/supabase/schema.sql

# Em hospedagem nao se cria o usuario de teste publico do README
spendwise.seed.usuario-teste=false
