# ============================================================
# SpendWise (Fintech) - configuracao do backend
# Conexao OBRIGATORIA com o Oracle Database da FIAP.
#
# Usuario e senha podem ser definidos por variavel de ambiente
# (DB_USER, DB_PASSWORD) ou trocando o valor depois dos dois pontos.
# A senha e a do seu usuario Oracle da FIAP (a mesma do SQL Developer).
#
# ATENCAO: 3 tentativas de login erradas bloqueiam o usuario da FIAP.
# ============================================================
spring.application.name=spendwise-backend
server.port=8080

spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:oracle.fiap.com.br}:${DB_PORT:1521}:${DB_SID:ORCL}
spring.datasource.username=${DB_USER:RM570197}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA_AQUI}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Poucas conexoes: o usuario da FIAP tem limite de sessoes
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# As tabelas T_FIN_* sao criadas pelo script database/ddl_tabelas_fintech.sql
# (o Hibernate nao altera o esquema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Datas em JSON como texto ISO (2026-11-05), nunca como lista de numeros
spring.jackson.serialization.write-dates-as-timestamps=false

# Origem permitida do frontend (React/Vite)
spendwise.cors.origens=http://localhost:5173,http://127.0.0.1:5173
