<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendWise</title>
    <script>
      // Aplica o tema salvo (ou o do sistema) antes de desenhar a pagina, para nao piscar claro no modo escuro
      ;(function () {
        try {
          var t = localStorage.getItem('spendwise.tema')
          if (t !== 'claro' && t !== 'escuro') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
          document.documentElement.setAttribute('data-tema', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
